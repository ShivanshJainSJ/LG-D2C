services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: livguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PROJECT_NAME=Livguard Quotation Management System
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be provided in production}
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be provided in production}
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - UPLOAD_DIR=/app/uploads
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: livguard_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_uploads:
    driver: local
